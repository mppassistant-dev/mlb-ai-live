<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>MLB Live API Upgrade</title>
<style>
body{font-family:Arial;background:#0b0f1a;color:white;margin:0;padding:20px}
.card{background:#121a2a;padding:12px;border-radius:10px;margin-bottom:10px}
button{padding:10px;border:0;border-radius:8px;background:#4a9eff;color:white}
</style>
</head>
<body>

<h2>⚾ MLB Live Games (Real API)</h2>
<button onclick="loadGames()">Refresh Games</button>

<div id="out"></div>

<script>
async function loadGames(){
  const out=document.getElementById('out');
  out.innerHTML="Loading...";
  const res = await fetch('/api/games');
  const data = await res.json();

  out.innerHTML = data.games.map(g => `
    <div class="card">
      <b>${g.away} @ ${g.home}</b><br/>
      ${g.status}<br/>
      ${g.time}
    </div>
  `).join('');
}
loadGames();
</script>

</body>
</html>
